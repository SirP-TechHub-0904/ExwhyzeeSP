name: Build and Deploy ExwhyzeeSP Master to Hostinger VPS

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository Code
        uses: actions/checkout@v4

      - name: 2. Setup .NET 9.0 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: 3. Restore NuGet Dependencies
        run: dotnet restore ExwhyzeeSP.slnx

      - name: 4. Build Solution in Release Mode
        run: dotnet build ExwhyzeeSP.slnx --configuration Release --no-restore

      - name: 5. Publish ExwhyzeeSP.Master Web Project
        run: |
          dotnet publish src/ExwhyzeeSP.Master/ExwhyzeeSP.Master.csproj \
            --configuration Release \
            --no-build \
            --output ./publish/master

      - name: 6. Deploy Published Bundle to VPS via SCP
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          source: "publish/master/**"
          target: "/var/www/exwhyzee-master"
          strip_components: 2

      - name: 7. Apply Server Permissions & Restart Service
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            # Ensure target folder and file permissions
            mkdir -p /var/www/exwhyzee-master
            chmod -R 755 /var/www/exwhyzee-master

            # Restart Master Service
            if systemctl is-active --quiet exwhyzee-master; then
              echo "Restarting exwhyzee-master service..."
              systemctl restart exwhyzee-master
            else
              echo "Starting exwhyzee-master service..."
              systemctl start exwhyzee-master || true
            fi

            # Check status
            systemctl status exwhyzee-master --no-pager || true
