name: Build and Deploy Divine Threshers Web to Hostinger VPS

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:
    inputs:
      target_dir:
        description: 'Target Deployment Directory on VPS'
        required: false
        default: '/var/www/divinethreshers-web'
      service_name:
        description: 'Systemd Service Name to Restart'
        required: false
        default: 'divinethreshers-web'

# ==============================================================================
# DEFAULT SCHOOL CONFIGURATION: Divine Threshers
# To deploy another school in the future, copy this workflow or update these variables.
# ==============================================================================
env:
  DEPLOY_PATH: ${{ github.event.inputs.target_dir || '/var/www/divinethreshers-web' }}
  SERVICE_NAME: ${{ github.event.inputs.service_name || 'divinethreshers-web' }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository Code
        uses: actions/checkout@v4

      - name: 2. Setup .NET 9.0 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: 3. Restore NuGet Dependencies
        run: dotnet restore ExwhyzeeSP.slnx

      - name: 4. Build Solution in Release Mode
        run: dotnet build ExwhyzeeSP.slnx --configuration Release --no-restore

      - name: 5. Publish ExwhyzeeSP.Web Project
        run: |
          dotnet publish src/ExwhyzeeSP.Web/ExwhyzeeSP.Web.csproj \
            --configuration Release \
            --no-build \
            --output ./publish/web

      - name: 6. Deploy Published Bundle to VPS via SCP
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          source: "publish/web/**"
          target: ${{ env.DEPLOY_PATH }}
          strip_components: 2

      - name: 7. Apply Server Permissions & Restart Divine Threshers Service
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            echo "Configuring permissions for ${{ env.DEPLOY_PATH }}..."
            mkdir -p ${{ env.DEPLOY_PATH }}
            chown -R www-data:www-data ${{ env.DEPLOY_PATH }}
            chmod -R 755 ${{ env.DEPLOY_PATH }}

            # Restart the school-specific service (divinethreshers-web)
            if systemctl is-active --quiet ${{ env.SERVICE_NAME }}; then
              echo "Restarting service: ${{ env.SERVICE_NAME }}..."
              systemctl restart ${{ env.SERVICE_NAME }}
            else
              echo "Starting service: ${{ env.SERVICE_NAME }}..."
              systemctl start ${{ env.SERVICE_NAME }} || true
            fi

            systemctl status ${{ env.SERVICE_NAME }} --no-pager || true
